name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan op gevoelige data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan
        env:
          # Eigen termen (servernamen e.d.), één per regel. Instellen onder
          # Settings → Secrets and variables → Actions.
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
        run: python scripts/check_sensitive.py --all

  test:
    name: Installeren en syntaxcontrole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Dependencies bot
        run: npm ci --no-audit --no-fund
      - name: Syntaxcontrole
        run: |
          node --check index.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
