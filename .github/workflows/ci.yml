name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan op gevoelige data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Scan
        env:
          # Eigen termen (servernamen e.d.), één per regel. Instellen onder
          # Settings → Secrets and variables → Actions.
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
        run: python scripts/check_sensitive.py --all

  test:
    name: Installeren en syntaxcontrole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Dependencies bot
        run: npm ci --no-audit --no-fund
      - name: Syntaxcontrole
        run: |
          node --check index.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
