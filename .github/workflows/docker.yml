name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 'Bouw opnieuw, ook als de tag al bestaat'
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hendriebuilds/wod

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versie.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tags ophalen voor de changelog-controle

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: VERSION gelijk aan package.json
        id: versie
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          P=$(node -p "require('./package.json').version")
          echo "VERSION=$V, package.json=$P"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION is geen geldig versienummer: '$V'"; exit 1
          fi
          if [ "$V" != "$P" ]; then
            echo "::error::VERSION ($V) en package.json ($P) verschillen"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Sectie in CHANGELOG.md bij een nieuwe versie
        env:
          V: ${{ steps.versie.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V bestaat al: geen nieuwe versie."
            exit 0
          fi
          # Zelfde uitsnede als de stap "GitHub Release": van "## [<versie>]" tot de volgende "## ["
          awk -v kop="## [$V]" 'index($0, kop) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          if ! awk -v kop="## [$V]" 'index($0, kop) == 1 {f=1} END {exit !f}' CHANGELOG.md; then
            echo "::error::Nieuwe versie $V zonder sectie '## [$V]' in CHANGELOG.md"; exit 1
          elif ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Sectie '## [$V]' in CHANGELOG.md is leeg"; exit 1
          fi
          echo "CHANGELOG.md heeft een sectie [$V] met tekst."

      - name: Syntaxcontrole bot
        run: |
          node --check index.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Panel bouwen
        working-directory: admin
        run: |
          npm ci --no-audit --no-fund
          npm run build

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # git-tag en GitHub Release aanmaken
      packages: write     # pushen naar GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # tags ophalen

      - name: Moet er gebouwd worden?
        id: nodig
        env:
          V: ${{ needs.check.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            if [ "$FORCE" = "true" ]; then
              echo "Tag v$V bestaat, maar force staat aan: opnieuw bouwen."
              echo "bouwen=true" >> "$GITHUB_OUTPUT"
              echo "tag=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$V bestaat al: niets te bouwen."
              echo "bouwen=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Nieuwe versie v$V: bouwen."
            echo "bouwen=true" >> "$GITHUB_OUTPUT"
            echo "tag=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.nodig.outputs.bouwen == 'true'

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.nodig.outputs.bouwen == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.nodig.outputs.bouwen == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Git-tag aanmaken
        if: steps.nodig.outputs.tag == 'true'
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          git tag "v$V" "$GITHUB_SHA"
          git push origin "v$V"

      # Mislukt deze stap, dan maakt "Run workflow" met force de release alsnog aan
      - name: GitHub Release
        if: steps.nodig.outputs.bouwen == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.check.outputs.version }}
        run: |
          # Sectie "## [<versie>]" uit CHANGELOG.md, tot de volgende "## ["
          awk -v kop="## [$V]" 'index($0, kop) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md 2>/dev/null || true
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "Release v$V bestaat al."
          elif grep -q '[^[:space:]]' release-notes.md; then
            gh release create "v$V" --title "v$V" --notes-file release-notes.md --verify-tag
          else
            echo "::warning::Geen tekst onder [$V] in CHANGELOG.md, notes worden gegenereerd."
            gh release create "v$V" --title "v$V" --generate-notes --verify-tag
          fi

      - name: Samenvatting
        if: steps.nodig.outputs.bouwen == 'true'
        run: |
          echo "### 🐳 ${IMAGE}:${{ needs.check.outputs.version }} gepusht (ook :latest)" >> "$GITHUB_STEP_SUMMARY"
