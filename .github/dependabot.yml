version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      bot-minor:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: weekly }
    groups:
      panel-minor:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
